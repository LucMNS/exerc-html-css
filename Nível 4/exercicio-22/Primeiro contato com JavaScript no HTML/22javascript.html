<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primeiro contato com JavaScript</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        padding: 24px;
        color: #243447;
        background: #edf4f2;
        font-family: Verdana, sans-serif;
        line-height: 1.6;
        transition: background-color 0.3s ease;
      }

      .painel {
        width: min(100%, 620px);
        padding: 36px;
        background: #ffffff;
        border-top: 8px solid #287271;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgb(22 78 99 / 14%);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        color: #164e63;
      }

      .descricao {
        margin: 0 0 24px;
      }

      .mensagem {
        min-height: 56px;
        padding: 14px;
        margin-bottom: 24px;
        color: #164e63;
        background: #e8f5f2;
        border-radius: 5px;
        font-weight: bold;
      }

      .botoes {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      button {
        padding: 11px 18px;
        color: #ffffff;
        background: #287271;
        border: 0;
        border-radius: 5px;
        cursor: pointer;
        font: inherit;
        font-weight: bold;
      }

      button:hover {
        background: #1d5554;
      }

      #botao-texto {
        color: #243447;
        background: #f4c95d;
      }

      #botao-texto:hover {
        background: #e6b83e;
      }

      @media (max-width: 500px) {
        .painel {
          padding: 28px 20px;
        }
      }
    </style>
  </head>
  <body>
    <main class="painel">
      <h1>Meu primeiro JavaScript</h1>
      <p class="descricao">
        Clique nos botões para ver o HTML e o JavaScript trabalhando juntos.
      </p>

      <p class="mensagem" id="mensagem">A mensagem aparecerá aqui.</p>

      <div class="botoes">
        <button type="button" id="botao-clique">Clique aqui</button>
        <button type="button" id="botao-texto">Mudar texto novamente</button>
      </div>
    </main>

    <script>
      const mensagem = document.querySelector("#mensagem");
      const botaoClique = document.querySelector("#botao-clique");
      const botaoTexto = document.querySelector("#botao-texto");

      // O JavaScript reage ao clique e altera elementos da página.
      botaoClique.addEventListener("click", () => {
        mensagem.textContent = "Você clicou no botão! A página mudou.";
        document.body.style.backgroundColor = "#d8e9ff";
      });

      botaoTexto.addEventListener("click", () => {
        mensagem.textContent = "O segundo botão alterou o texto novamente!";
      });
    </script>
  </body>
</html>
