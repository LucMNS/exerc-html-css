<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Galeria com os quatro melhores jogos da história segundo o Metacritic."
    />
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
    <title>Top 4 jogos da história | Galeria</title>
  </head>
  <body>
    <h1>Top 4 melhores jogos da história</h1>
    <p>Uma seleção baseada nas maiores notas históricas do Metacritic.</p>

    <figure>
      <a
        href="https://www.metacritic.com/game/the-legend-of-zelda-ocarina-of-time/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="img/zeldaocarina.png"
          alt="Capa de The Legend of Zelda: Ocarina of Time"
          width="200"
        />
      </a>
      <figcaption>
        <strong>The Legend of Zelda: Ocarina of Time</strong> - aventura de ação
        lançada para Nintendo 64, com nota 99 no Metacritic.
      </figcaption>
    </figure>

    <figure>
      <a
        href="https://www.metacritic.com/game/tony-hawks-pro-skater-2/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="img/tony.png"
          alt="Capa de Tony Hawk's Pro Skater 2"
          width="200"
        />
      </a>
      <figcaption>
        <strong>Tony Hawk's Pro Skater 2</strong> - clássico jogo de skate para
        PlayStation, com nota 98 no Metacritic.
      </figcaption>
    </figure>

    <figure>
      <a
        href="https://www.metacritic.com/game/grand-theft-auto-iv/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="img/gtaiv.png"
          alt="Capa de Grand Theft Auto IV"
          width="200"
        />
      </a>
      <figcaption>
        <strong>Grand Theft Auto IV</strong> - jogo de ação em mundo aberto para
        PlayStation 3 e Xbox 360, com nota 98 no Metacritic.
      </figcaption>
    </figure>

    <figure>
      <a
        href="https://www.metacritic.com/game/soulcalibur/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img src="img/soulcalibur.png" alt="Capa de Soulcalibur" width="200" />
      </a>
      <figcaption>
        <strong>Soulcalibur</strong> - jogo de luta lançado para Dreamcast, com
        nota 98 no Metacritic.
      </figcaption>
    </figure>
  </body>
</html>
