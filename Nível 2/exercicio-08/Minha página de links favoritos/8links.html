<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meus links favoritos</title>
  </head>
  <body>
    <h1>Meus links favoritos</h1>
    <p>Sites úteis para quem estuda tecnologia:</p>

    <ul>
      <li>
        <a
          href="https://www.w3schools.com/"
          title="Aprender HTML, CSS, JavaScript e outras tecnologias"
          target="_blank"
          rel="noopener noreferrer"
        >
          W3Schools
        </a>
      </li>
      <li>
        <a
          href="https://developer.mozilla.org/pt-BR/"
          title="Consultar a documentação da MDN Web Docs"
          target="_blank"
          rel="noopener noreferrer"
        >
          MDN Web Docs
        </a>
      </li>
      <li>
        <a
          href="https://github.com/"
          title="Hospedar e colaborar em projetos de código"
        >
          GitHub
        </a>
      </li>
      <li>
        <a
          href="https://stackoverflow.com/"
          title="Encontrar respostas para dúvidas de programação"
        >
          Stack Overflow
        </a>
      </li>
      <li>
        <a
          href="https://www.freecodecamp.org/portuguese/"
          title="Praticar programação com cursos e exercícios"
        >
          freeCodeCamp
        </a>
      </li>
      <li>
        <a
          href="https://roadmap.sh/"
          title="Consultar caminhos de aprendizado em tecnologia"
        >
          Roadmap.sh
        </a>
      </li>
    </ul>

    <h2>Link com imagem</h2>
    <a
      href="https://developer.mozilla.org/pt-BR/docs/Web/HTML"
      title="Abrir o guia de HTML da MDN"
    >
      <img
        src="https://placehold.co/300x120/png?text=Guia+HTML"
        alt="Imagem com o texto Guia HTML"
        width="300"
        height="120"
      />
    </a>
  </body>
</html>
